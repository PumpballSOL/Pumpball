<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 600" width="520" height="600" role="img" aria-label="Lottery ball machine with balls spelling PUMPBALL tumbling; one ball drops out.">
<title>PUMPBALL ball machine</title>
<defs>
<radialGradient id="gl" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#0E2A1C"/><stop offset="1" stop-color="#040806"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FF88"/><stop offset="1" stop-color="#00B85C" stop-opacity=".3"/></linearGradient>
<clipPath id="gc"><circle cx="260" cy="230" r="186"/></clipPath>
<filter id="gw" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<style>
.ring{transform-box:fill-box;transform-origin:center;animation:rot 48s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hal{animation:hal 3.6s ease-in-out infinite}
@keyframes hal{0%,100%{opacity:.25}50%{opacity:.55}}
.win{animation:win 9s ease-in infinite}
@keyframes win{0%,54%{opacity:0;transform:translateY(-34px)}56%{opacity:1;transform:translateY(-34px)}68%{opacity:1;transform:translateY(52px)}72%{transform:translateY(46px)}75%{transform:translateY(52px)}92%{opacity:1;transform:translateY(52px)}97%,100%{opacity:0;transform:translateY(52px)}}
.wg{animation:wg 9s ease-in-out infinite}
@keyframes wg{0%,66%{opacity:0}72%,90%{opacity:.85}96%,100%{opacity:0}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
<rect width="520" height="600" rx="16" fill="#050505"/>
<rect x=".5" y=".5" width="519" height="599" rx="16" fill="none" stroke="#1C3A2A"/>
<circle class="hal" cx="260" cy="230" r="190" fill="#00FF88" filter="url(#gw)"/>
<circle class="ring" cx="260" cy="230" r="204" fill="none" stroke="#00FF88" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 12"/>
<!-- neck + tray -->
<rect x="232" y="404" width="56" height="112" rx="6" fill="#08100B" stroke="#1C3A2A" stroke-width="2"/>
<rect x="140" y="512" width="240" height="26" rx="8" fill="#0B140F" stroke="#00FF88" stroke-opacity=".5"/>
<rect x="170" y="538" width="14" height="22" fill="#1C3A2A"/><rect x="336" y="538" width="14" height="22" fill="#1C3A2A"/>
<!-- globe -->
<circle cx="260" cy="230" r="190" fill="url(#gl)"/>
<g clip-path="url(#gc)"><g transform="translate(260 230) rotate(114)"><g>
<circle r="23" fill="#fff" stroke="#000" stroke-width="2"/>
<g transform="rotate(-114)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-114)">P</text>
<animateMotion path="M105 0 A105 84 0 1 1 -105 0 A105 84 0 1 1 105 0Z" dur="8.9s" begin="-1.9s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(92)"><g>
<circle r="23" fill="#00FF88" stroke="#000" stroke-width="2"/>
<g transform="rotate(-92)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-92)">U</text>
<animateMotion path="M137 0 A137 90 0 1 0 -137 0 A137 90 0 1 0 137 0Z" dur="9.0s" begin="-2.1s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(105)"><g>
<circle r="23" fill="#000" stroke="#00FF88" stroke-width="2"/>
<g transform="rotate(-105)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
