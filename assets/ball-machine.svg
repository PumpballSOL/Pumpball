<animateMotion path="M96 0 A96 67 0 1 1 -96 0 A96 67 0 1 1 96 0Z" dur="6.4s" begin="-5.1s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(8)"><g>
<circle r="23" fill="#fff" stroke="#000" stroke-width="2"/>
<g transform="rotate(-8)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-8)">P</text>
<animateMotion path="M108 0 A108 60 0 1 0 -108 0 A108 60 0 1 0 108 0Z" dur="12.0s" begin="-8.9s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(6)"><g>
<circle r="23" fill="#00FF88" stroke="#000" stroke-width="2"/>
<g transform="rotate(-6)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-6)">B</text>
<animateMotion path="M142 0 A142 80 0 1 1 -142 0 A142 80 0 1 1 142 0Z" dur="8.0s" begin="-4.0s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(66)"><g>
<circle r="23" fill="#000" stroke="#00FF88" stroke-width="2"/>
<g transform="rotate(-66)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#00FF88" transform="rotate(-66)">A</text>
<animateMotion path="M102 0 A102 98 0 1 0 -102 0 A102 98 0 1 0 102 0Z" dur="6.9s" begin="-5.7s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(82)"><g>
<circle r="23" fill="#fff" stroke="#000" stroke-width="2"/>
<g transform="rotate(-82)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-82)">L</text>
<animateMotion path="M102 0 A102 96 0 1 1 -102 0 A102 96 0 1 1 102 0Z" dur="9.3s" begin="-3.2s" repeatCount="indefinite"/>
</g></g><g transform="translate(260 230) rotate(7)"><g>
<circle r="23" fill="#00FF88" stroke="#000" stroke-width="2"/>
<g transform="rotate(-7)"><ellipse cx="-8" cy="-9" rx="7" ry="3.6" fill="#fff" opacity=".5" transform="rotate(-30 -8 -9)"/></g>
<text y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="22" fill="#000" transform="rotate(-7)">L</text>
<animateMotion path="M121 0 A121 58 0 1 0 -121 0 A121 58 0 1 0 121 0Z" dur="11.2s" begin="-2.6s" repeatCount="indefinite"/>
</g></g></g>
<circle cx="260" cy="230" r="190" fill="none" stroke="url(#rim)" stroke-width="5"/>
<path d="M120 130 A150 150 0 0 1 240 68" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
<path d="M112 170 A150 150 0 0 1 122 140" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/>
<!-- winner ball -->
<g transform="translate(260 452)">
<circle class="wg" r="34" fill="#00FF88" filter="url(#gw)"/>
<g class="win">
<circle r="24" fill="#00FF88" stroke="#000" stroke-width="2"/>
<ellipse cx="-8" cy="-10" rx="8" ry="4" fill="#fff" opacity=".6" transform="rotate(-30 -8 -10)"/>
<text y="9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-weight="800" font-size="26" fill="#000">1</text>
</g></g>
<text x="260.0" y="582" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="14" letter-spacing="2" fill="#00FF88">&gt; the ball drops<tspan class="bl">_</tspan></text>
</svg>