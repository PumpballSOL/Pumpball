<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 16" width="1200" height="16" role="presentation">
<defs>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#00FF88"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="16"/></clipPath>
</defs>
<style>
.d{stroke-dasharray:2 8;animation:dd 1.2s linear infinite}
@keyframes dd{to{stroke-dashoffset:-10}}
.s{animation:sw 4.5s linear infinite}
@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
.r{transform-box:fill-box;transform-origin:center;animation:rot 6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
<rect width="1200" height="16" rx="3" fill="#050505"/>
<line class="d" x1="0" y1="8" x2="1200" y2="8" stroke="#00FF88" stroke-opacity=".35" stroke-width="2"/>
<g clip-path="url(#c)"><rect class="s" x="0" y="6" width="300" height="4" fill="url(#sw)"/></g>
<rect x="0" y="0" width="1200" height="16" fill="none"/>
<g><rect x="588" y="0" width="24" height="16" fill="#050505"/>
<rect class="r" x="594" y="2" width="12" height="12" fill="none" stroke="#00FF88" stroke-width="2"/>
<rect x="598" y="6" width="4" height="4" fill="#00FF88"/></g>
</svg>